name: Refresh CAISO daily margin data

on:
  schedule:
    - cron: '0 13 * * 1' # every Monday 13:00 UTC (~6am Pacific)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh trailing 45-day window
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch.py --refresh

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/caiso-daily.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/caiso-daily.json
          git commit -m "Refresh CAISO daily margin data"
          git push
